<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator</title>
<style>
  :root{
    --ink:#1c2321;
    --paper:#fbfaf7;
    --line:#d8d3c5;
    --muted:#7a7568;
    --accent:#8a3b2f;
    --accent-soft:#f4e6e0;
    --field-bg:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#eeece4;
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    font-size:14px;
    line-height:1.4;
    padding:24px;
  }
  .sheet{
    max-width:960px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    padding:36px 40px;
  }
  h1{
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.5px;
    text-align:center;
  }
  .logo{
    max-height:110px;
    max-width:340px;
    display:block;
  }
  .signoff{
    display:flex;
    justify-content:flex-end;
    margin-bottom:24px;
  }
  .signoff .block{
    text-align:center;
  }
  .signoff img{
    max-height:60px;
    max-width:180px;
    display:block;
    margin:0 auto 4px;
  }
  .signoff .caption{
    border-top:1px solid var(--ink);
    padding-top:4px;
    font-size:12px;
    color:var(--muted);
  }
  .sub{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:24px;
  }
  .toprow{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:24px;
  }
  .meta{
    display:grid;
    grid-template-columns:auto auto;
    gap:6px 10px;
    font-size:13px;
    justify-self:end;
  }
  .meta label{color:var(--muted);text-align:right;}
  .meta input{border:none;border-bottom:1px solid var(--line);background:transparent;font-size:13px;padding:2px 4px;text-align:right;width:110px;}
  .parties{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    margin-bottom:24px;
  }
  .party h2{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--accent);
    margin:0 0 8px;
  }
  .party input, .party textarea{
    display:block;
    width:100%;
    border:1px solid var(--line);
    background:var(--field-bg);
    padding:6px 8px;
    margin-bottom:6px;
    font-size:13px;
    font-family:inherit;
    border-radius:2px;
  }
  .party textarea{resize:vertical;min-height:42px;}
  .toggles{
    display:flex;
    gap:20px;
    margin-bottom:18px;
    font-size:13px;
  }
  .toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:8px;
  }
  th{
    background:var(--ink);
    color:var(--paper);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:8px 6px;
    text-align:right;
  }
  th:nth-child(1),th:nth-child(2){text-align:left;}
  td{
    border-bottom:1px solid var(--line);
    padding:6px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    vertical-align:top;
  }
  td:nth-child(1),td:nth-child(2){text-align:left;}
  td input{
    width:100%;
    border:none;
    background:transparent;
    text-align:right;
    font-size:13px;
    font-family:inherit;
    padding:2px;
  }
  td:nth-child(2) input{text-align:left;}
  .f-name{
    width:100%;
    border:none;
    background:transparent;
    text-align:left;
    font-size:13px;
    font-family:inherit;
    padding:2px;
    resize:none;
    overflow:hidden;
    white-space:pre-wrap;
    word-break:break-word;
    field-sizing:content;
  }
  .amt-line{font-size:11px;color:var(--muted);}
  .chk-cell{text-align:center;}
  .row-chk{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
  .rm-row{
    border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px;
  }
  .rm-row:hover{color:var(--accent);}
  .add-row{
    border:1px dashed var(--line);
    background:none;
    color:var(--accent);
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
    border-radius:2px;
    margin-bottom:24px;
  }
  .add-row:hover{background:var(--accent-soft);}
  .totals{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
  }
  .totals table{width:280px;margin:0;}
  .totals td{border:none;padding:4px 6px;}
  .totals tr.grand td{
    border-top:2px solid var(--ink);
    font-weight:700;
    font-size:16px;
    color:var(--accent);
  }
  .words{
    border:1px solid var(--line);
    background:var(--accent-soft);
    padding:10px 12px;
    font-size:13px;
    margin-bottom:28px;
  }
  .words b{color:var(--accent);}
  .actions{
    display:flex;
    gap:10px;
  }
  .actions button{
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:8px 18px;
    font-size:13px;
    cursor:pointer;
    border-radius:2px;
  }
  .actions button.secondary{
    background:none;
    color:var(--ink);
  }
  @media print{
    body{background:#fff;padding:0;}
    .sheet{border:none;max-width:100%;}
    .no-print{display:none !important;}
    .rm-row{display:none;}
    td input, .party input, .party textarea, .meta input{border:none !important;}
    .row-chk input[type="checkbox"]{display:none;}
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="toprow">
    <img src="logo_2.png" alt="Company logo" class="logo">
    <h1>INVOICE</h1>
    <div class="meta">
      <label>Invoice No.</label><input id="invNo" value="INV-0001">
      <label>Invoice Date</label><input id="invDate" type="date">
    </div>
  </div>

  <div class="parties">
    <div class="party">
      <h2>Biller (From)</h2>
      <input id="billerName" placeholder="Business / Individual name">
      <input id="billerEmail" placeholder="Email / Phone">
    </div>
    <div class="party">
      <h2>Recipient (Bill To)</h2>
      <input id="recipientName" placeholder="Client name">
      <input id="recipientEmail" placeholder="Email / Phone">
    </div>
  </div>

  <div class="toggles no-print">
    <label>Currency
      <select id="currency">
        <option value="INR" selected>INR (₹)</option>
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="GBP">GBP (£)</option>
        <option value="CAD">CAD ($)</option>
      </select>
    </label>
  </div>

  <table>
    <thead>
      <tr>
        <th>Sr.</th>
        <th>Product / Service</th>
        <th>Qty</th>
        <th>Rate</th>
        <th>GST (18%)</th>
        <th>Forex (3.5%)</th>
        <th>Total</th>
        <th class="no-print"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="add-row no-print" id="addRow">+ Add line item</button>

  <div class="totals">
    <table>
      <tr><td>Subtotal</td><td id="sumSubtotal">0.00</td></tr>
      <tr><td>GST</td><td id="sumGst">0.00</td></tr>
      <tr><td>Forex Charge</td><td id="sumForex">0.00</td></tr>
      <tr class="grand"><td>Grand Total</td><td id="sumGrand">0.00</td></tr>
    </table>
  </div>

  <div class="words">Amount in words: <b id="amountWords">Zero Rupees Only</b></div>

  <div class="signoff">
    <div class="block">
      <img src="signature.jpg" alt="Signature">
      <div class="caption">Authorized Signatory</div>
    </div>
  </div>

  <div class="actions no-print">
    <button id="printBtn">Preview &amp; Save as PDF</button>
    <button class="secondary" id="resetBtn">Reset</button>
  </div>
</div>

<script>
const GST_RATE = 0.18;
const FOREX_RATE = 0.035;
const CURRENCIES = {
  INR: { symbol: '₹', locale: 'en-IN', word: 'Rupees' },
  USD: { symbol: '$', locale: 'en-US', word: 'Dollars' },
  EUR: { symbol: '€', locale: 'de-DE', word: 'Euros' },
  GBP: { symbol: '£', locale: 'en-GB', word: 'Pounds' },
  CAD: { symbol: 'CA$', locale: 'en-CA', word: 'Canadian Dollars' },
};

const rowsBody = document.getElementById('rows');
const currencySelect = document.getElementById('currency');

function makeRow(name = '', qty = 1, rate = 0) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="sr"></td>
    <td><textarea class="f-name" rows="1" placeholder="Item name">${name}</textarea></td>
    <td><input class="f-qty" type="number" min="0" step="1" value="${qty}"></td>
    <td><input class="f-rate" type="number" min="0" step="0.01" value="${rate}"></td>
    <td class="chk-cell"><label class="row-chk"><input type="checkbox" class="f-gst-on" checked><span class="amt-line f-gst-amt">0.00</span></label></td>
    <td class="chk-cell"><label class="row-chk"><input type="checkbox" class="f-forex-on"><span class="amt-line f-forex-amt">0.00</span></label></td>
    <td class="f-total">0.00</td>
    <td class="no-print"><button class="rm-row" title="Remove">&times;</button></td>
  `;
  tr.querySelector('.rm-row').addEventListener('click', () => { tr.remove(); recalc(); });
  return tr;
}

function addRow(name, qty, rate) {
  rowsBody.appendChild(makeRow(name, qty, rate));
  recalc();
}

function money(n) {
  const c = CURRENCIES[currencySelect.value];
  return c.symbol + n.toLocaleString(c.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function amountInWords(num) {
  const word = CURRENCIES[currencySelect.value].word;
  num = Math.round(num);
  if (num === 0) return `Zero ${word} Only`;
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
    'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

  function twoDigits(n) {
    if (n < 20) return ones[n];
    return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
  }
  function threeDigits(n) {
    if (n < 100) return twoDigits(n);
    return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + twoDigits(n % 100) : '');
  }

  const crore = Math.floor(num / 10000000); num %= 10000000;
  const lakh = Math.floor(num / 100000); num %= 100000;
  const thousand = Math.floor(num / 1000); num %= 1000;
  const hundred = num;

  let parts = [];
  if (crore) parts.push(threeDigits(crore) + ' Crore');
  if (lakh) parts.push(threeDigits(lakh) + ' Lakh');
  if (thousand) parts.push(threeDigits(thousand) + ' Thousand');
  if (hundred) parts.push(threeDigits(hundred));

  return parts.join(' ') + ` ${word} Only`;
}

function recalc() {
  let subtotal = 0, gstTotal = 0, forexTotal = 0;

  [...rowsBody.children].forEach((tr, i) => {
    tr.querySelector('.sr').textContent = i + 1;
    const qty = parseFloat(tr.querySelector('.f-qty').value) || 0;
    const rate = parseFloat(tr.querySelector('.f-rate').value) || 0;
    const gstOn = tr.querySelector('.f-gst-on').checked;
    const forexOn = tr.querySelector('.f-forex-on').checked;
    const amount = qty * rate;
    const gstAmt = gstOn ? amount * GST_RATE : 0;
    const forexAmt = forexOn ? amount * FOREX_RATE : 0;
    const total = amount + gstAmt + forexAmt;

    tr.querySelector('.f-gst-amt').textContent = gstOn ? money(gstAmt) : '—';
    tr.querySelector('.f-forex-amt').textContent = forexOn ? money(forexAmt) : '—';
    tr.querySelector('.f-total').textContent = money(total);

    subtotal += amount;
    gstTotal += gstAmt;
    forexTotal += forexAmt;
  });

  const grand = subtotal + gstTotal + forexTotal;
  document.getElementById('sumSubtotal').textContent = money(subtotal);
  document.getElementById('sumGst').textContent = money(gstTotal);
  document.getElementById('sumForex').textContent = money(forexTotal);
  document.getElementById('sumGrand').textContent = money(grand);
  document.getElementById('amountWords').textContent = amountInWords(grand);
}

const STORAGE_KEY = 'invoiceGeneratorState';

function saveState() {
  const state = {
    invNo: document.getElementById('invNo').value,
    invDate: document.getElementById('invDate').value,
    billerName: document.getElementById('billerName').value,
    billerEmail: document.getElementById('billerEmail').value,
    recipientName: document.getElementById('recipientName').value,
    recipientEmail: document.getElementById('recipientEmail').value,
    currency: currencySelect.value,
    rows: [...rowsBody.children].map(tr => ({
      name: tr.querySelector('.f-name').value,
      qty: tr.querySelector('.f-qty').value,
      rate: tr.querySelector('.f-rate').value,
      gstOn: tr.querySelector('.f-gst-on').checked,
      forexOn: tr.querySelector('.f-forex-on').checked,
    })),
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return false;
  let state;
  try { state = JSON.parse(raw); } catch { return false; }

  document.getElementById('invNo').value = state.invNo ?? 'INV-0001';
  document.getElementById('invDate').value = state.invDate ?? '';
  document.getElementById('billerName').value = state.billerName ?? '';
  document.getElementById('billerEmail').value = state.billerEmail ?? '';
  document.getElementById('recipientName').value = state.recipientName ?? '';
  document.getElementById('recipientEmail').value = state.recipientEmail ?? '';
  currencySelect.value = state.currency ?? 'INR';

  rowsBody.innerHTML = '';
  (state.rows?.length ? state.rows : [{ name: '', qty: 1, rate: 0, gstOn: true, forexOn: false }])
    .forEach(r => {
      const tr = makeRow(r.name, r.qty, r.rate);
      tr.querySelector('.f-gst-on').checked = r.gstOn;
      tr.querySelector('.f-forex-on').checked = r.forexOn;
      rowsBody.appendChild(tr);
    });
  return true;
}

rowsBody.addEventListener('input', () => { recalc(); saveState(); });
rowsBody.addEventListener('change', () => { recalc(); saveState(); });
currencySelect.addEventListener('change', () => { recalc(); saveState(); });
document.getElementById('addRow').addEventListener('click', () => { addRow(); saveState(); });
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.querySelectorAll('.party input, .meta input').forEach(el => el.addEventListener('input', saveState));
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all fields?')) {
    localStorage.removeItem(STORAGE_KEY);
    rowsBody.innerHTML = '';
    addRow('', 1, 0);
    document.querySelectorAll('.party input, .party textarea, .meta input').forEach(el => el.value = '');
    document.getElementById('invNo').value = 'INV-0001';
    document.getElementById('invDate').valueAsDate = new Date();
    recalc();
  }
});

if (!loadState()) {
  document.getElementById('invDate').valueAsDate = new Date();
  addRow('', 1, 0);
}
recalc();
</script>
</body>
</html>
